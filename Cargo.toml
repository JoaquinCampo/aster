[package]
name = "aster"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A durable, observable agent harness control plane built around Pi"

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
